services:
  backend:
    build:
      context: ./Backend
    ports:
      - '8000:8000'
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - '5173:80'
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
